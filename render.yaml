services:
  # -------------------------------------
  # 1. FastAPI Backend (Web Service)
  # -------------------------------------
  - type: web
    name: medbot-backend
    env: python
    region: ohio
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: "10000"
      - key: LITELLM_MODEL
        value: "gemini/gemini-3.5-flash"
      - key: MONGODB_URI
        sync: false # Requires manual entry in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false # Requires manual entry in Render Dashboard
      - key: FRONTEND_URL
        value: "https://medbot-frontend.onrender.com"

  # -------------------------------------
  # 2. React/Vite Frontend (Static Site)
  # -------------------------------------
  - type: web
    name: medbot-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://medbot-backend.onrender.com" # Should match backend service name
